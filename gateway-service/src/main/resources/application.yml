server:
  port: 8080
  ssl:
    enabled: ${SSL_ENABLED:true}
    key-store: classpath:keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: gateway

keycloak:
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/auth/realms/church-realm/protocol/openid-connect/certs}
  issuer-uri: ${KEYCLOAK_ISSUER_URI:https://localhost:8080/auth/realms/church-realm}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-route
          uri: ${KEYCLOAK_BASE_URI:http://localhost:8180}
          predicates:
            - Path=/auth/**

        - id: prayer-public-route
          uri: lb://prayer-service
          predicates:
            - Path=/api/public/prayers/**

        - id: prayer-admin-route
          uri: lb://prayer-service
          predicates:
            - Path=/api/admin/prayers/**

        - id: prayer-websocket-route
          uri: lb://prayer-service
          predicates:
            - Path=/ws/**

        - id: user-route
          uri: lb://user-service
          predicates:
            - Path=/api/users/**

        - id: events-route
          uri: lb://events-service
          predicates:
            - Path=/api/events/**

        - id: notification-route
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

spring.zipkin.base-url: ${ZIPKIN_BASE_URL:http://localhost:9411}
spring.sleuth.sampler.probability: 1.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
    covey.gateway: INFO
