server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-prayer}:5432/prayerdb
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:prayer}
    password: ${DB_PASS:prayer}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  session:
    timeout: 24h

user:
  service:
    url: http://user-service

logging:
  level:
    org.springframework: INFO
    covey: INFO
