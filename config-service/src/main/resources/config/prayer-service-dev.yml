server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:prayerdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  session:
    timeout: 24h

user:
  service:
    url: http://user-service

logging:
  level:
    org.springframework: DEBUG
    covey: DEBUG
