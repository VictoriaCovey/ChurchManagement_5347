server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-notification}:5432/notificationdb
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:notification}
    password: ${DB_PASS:notification}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

logging:
  level:
    org.springframework: INFO
    covey: INFO
