# Active when SPRING_PROFILES_ACTIVE=render. The gateway routes directly to each service's
# Render URL (see gateway-service's application-render.yml) instead of via Eureka, so there's
# nothing for this service to register with.
eureka.client.enabled=false

# Render's health check targets port 10000 regardless of the PORT env var or the port its own
# scanner detects the app listening on (confirmed empirically - not documented anywhere). Rather
# than fight that, just listen where Render is already looking. Local/dev/docker-compose keep
# using the port in application.properties - this only applies under the render profile.
server.port=10000
