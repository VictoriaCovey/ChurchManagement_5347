# Active when SPRING_PROFILES_ACTIVE=render. The gateway routes directly to each service's
# Render URL (see gateway-service's application-render.yml) instead of via Eureka, so there's
# nothing for this service to register with.
eureka.client.enabled=false

# Render's health check targets port 10000 regardless of the PORT env var or the port its own
# scanner detects the app listening on (confirmed empirically - not documented anywhere). Rather
# than fight that, just listen where Render is already looking. Local/dev/docker-compose keep
# using the port in application.properties - this only applies under the render profile.
server.port=10000

# Actuator auto-detects the JMS ConnectionFactory bean (from spring-boot-starter-artemis) and
# adds a live JMS connectivity check to /actuator/health. Since Artemis isn't deployed to Render
# by design, that check always fails and drags the whole health endpoint down with it (confirmed
# from deploy logs: the failure surfaces mid-request, inside the servlet filter chain, i.e. while
# handling the health check itself). Disable it here - the JMS producer already degrades
# gracefully (try/catch around convertAndSend), so this doesn't mask a real problem.
management.health.jms.enabled=false
