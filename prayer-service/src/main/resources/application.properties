# Service identity
spring.application.name=prayer-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.fail-fast=false
spring.cloud.config.retry.max-attempts=1

# Local fallback (active when config server is not reachable)
server.port=8081
spring.datasource.url=jdbc:h2:mem:prayerdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
logging.level.org.springframework=INFO
user.service.url=${USER_SERVICE_URL:http://localhost:8082}

# Service discovery
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Security - validate JWTs issued by Keycloak
keycloak.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/auth/realms/church-realm/protocol/openid-connect/certs}
keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:https://localhost:8080/auth/realms/church-realm}

# JMS (ActiveMQ Artemis) - used to publish notifications instead of calling notification-service directly
spring.artemis.mode=native
spring.artemis.broker-url=${ARTEMIS_BROKER_URL:tcp://localhost:61616}
spring.artemis.user=${ARTEMIS_USER:artemis}
spring.artemis.password=${ARTEMIS_PASSWORD:artemis}
jms.notifications-queue=notifications.queue

# Distributed tracing
spring.zipkin.base-url=${ZIPKIN_BASE_URL:http://localhost:9411}
spring.sleuth.sampler.probability=1.0
